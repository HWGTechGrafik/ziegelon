# Baut Ziegelon und stellt es auf GitHub Pages bereit.
#
# Der Link zum Weitergeben lautet danach:
#   https://hwgtechgrafik.github.io/ziegelon/
#
# Einmalig einzurichten: im Repository unter Settings > Pages als Quelle
# "GitHub Actions" auswaehlen. Ohne das laeuft der Ablauf zwar durch, es wird
# aber nichts veroeffentlicht.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen - eine halb hochgeladene
# Fassung waere schlimmer als eine kurz veraltete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Erst pruefen, dann bauen: eine Fassung mit fehlerhafter Rechnung
      # soll gar nicht erst auf die Baustelle kommen.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /ziegelon/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
